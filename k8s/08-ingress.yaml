apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bc-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: bc.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bc-api
                port:
                  number: 8000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: bc-front
                port:
                  number: 80