
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bc-front
  labels:
    app: bc-front

spec:
  replicas: 1

  selector:
    matchLabels:
      app: bc-front

  template:
    metadata:
      labels:
        app: bc-front

    spec:
      containers:
        - name: bc-front
          image: bc-front:1.0
          imagePullPolicy: IfNotPresent

          # CONFIGURATION DE STREAMLIT
          env:
            - name: API_URL
              value: "http://bc-api:8000"

            - name: APP_TITLE
              valueFrom:
                configMapKeyRef:
                  name: ml-config
                  key: APP_TITLE

            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: API_KEY

          ports:
            - containerPort: 8501

          # STARTUP PROBE
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 5
            failureThreshold: 24

          # LIVENESS PROBE
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 10
            failureThreshold: 3

          # READINESS PROBE
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 5
            failureThreshold: 2

          # RESSOURCES CPU ET RAM
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "768Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: bc-front

spec:
  type: ClusterIP

  selector:
    app: bc-front

  ports:
    - name: http
      port: 80
      targetPort: 8501
      protocol: TCP
