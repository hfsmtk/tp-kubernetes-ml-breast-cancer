
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app: minio

spec:
  replicas: 1

  selector:
    matchLabels:
      app: minio

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: minio

    spec:
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest

          args:
            - server
            - /data
            - --console-address
            - ":9001"

          # SECRETS MINIO
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ACCESS_KEY

            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_SECRET_KEY

          ports:
            - containerPort: 9000
              name: s3

            - containerPort: 9001
              name: console

          # READINESS PROBE
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 5
            failureThreshold: 3

          # LIVENESS PROBE
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 10
            failureThreshold: 3

          # RESSOURCES CPU ET RAM
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # STOCKAGE PERSISTANT
          volumeMounts:
            - name: minio-data
              mountPath: /data

      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio

spec:
  type: ClusterIP

  selector:
    app: minio

  ports:
    - name: s3
      port: 9000
      targetPort: 9000
      protocol: TCP

    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
